<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>博識牙醫診所 - 數位初診資料表</title>
  <!-- 引入 Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入 Signature Pad CDN -->
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
  <style>
    body {
      background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    /* 強制禁止畫布上的預設觸控滑動行為，確保手機可順利簽名 */
    #signature-pad {
      touch-action: none;
      -ms-touch-action: none;
    }
  </style>
</head>
<body class="min-h-screen py-8 px-4 flex items-center justify-center">

  <div class="max-w-xl w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-sky-100">
    
    <!-- 頂部診所標題與四步驟進度條 -->
    <div class="bg-sky-700 text-white p-6 text-center">
      <h1 class="text-xl font-bold tracking-wider">博識牙醫診所 - 初診健康評估表</h1>
      <p class="text-xs text-sky-200 mt-1">請協助填寫真實健康狀況，以保障您的看診安全</p>
      
      <!-- 進度指示器 (4 Steps) -->
      <div class="flex justify-between mt-6 text-xs font-semibold text-sky-100 px-2">
        <div id="indicator-1" class="step-ind text-white border-b-2 border-white pb-1">1. 基本資料</div>
        <div id="indicator-2" class="step-ind opacity-60 pb-1">2. 醫療病史</div>
        <div id="indicator-3" class="step-ind opacity-60 pb-1">3. 用藥安全</div>
        <div id="indicator-4" class="step-ind opacity-60 pb-1">4. 心理狀態與簽名</div>
      </div>
    </div>

    <!-- 表單主體 -->
    <form id="intakeForm" class="p-6">

      <!-- ========================================== -->
      <!-- STEP 1: 基本身分與聯絡資料 -->
      <!-- ========================================== -->
      <div class="step-pane" data-step="1">
        <h2 class="text-lg font-bold text-slate-800 mb-4 border-b pb-2">1. 基本身分與聯絡資料</h2>
        <div class="space-y-4 text-sm">
          <div>
            <label class="block font-medium text-slate-700 mb-1">真實姓名 <span class="text-red-500">*</span></label>
            <input type="text" required class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 outline-none" placeholder="請輸入姓名">
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block font-medium text-slate-700 mb-1">身分證字號 <span class="text-red-500">*</span></label>
              <input type="text" required class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 outline-none" placeholder="例如：A123456789">
            </div>
            <div>
              <label class="block font-medium text-slate-700 mb-1">性別 <span class="text-red-500">*</span></label>
              <select class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 outline-none bg-white">
                <option>男</option>
                <option>女</option>
                <option>其他</option>
              </select>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block font-medium text-slate-700 mb-1">出生年月日 <span class="text-red-500">*</span></label>
              <input type="date" required class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 outline-none">
            </div>
            <div>
              <label class="block font-medium text-slate-700 mb-1">行動電話 <span class="text-red-500">*</span></label>
              <input type="tel" required class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 outline-none" placeholder="0911-465-564">
            </div>
          </div>
          
          <!-- Email 與 公司/職業 左右並排 -->
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block font-medium text-slate-700 mb-1">電子郵件 (Email)</label>
              <input type="email" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 outline-none" placeholder="example@email.com">
            </div>
            <div>
              <label class="block font-medium text-slate-700 mb-1">公司 / 職業</label>
              <input type="text" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 outline-none" placeholder="請輸入公司或職業">
            </div>
          </div>

          <!-- 居住地址 + 快速選址按鈕 -->
          <div>
            <div class="flex items-center justify-between mb-1">
              <label for="addressInput" class="block font-medium text-slate-700">居住地址</label>
              <button type="button" onclick="openAddressModal()" class="text-xs bg-sky-100 hover:bg-sky-200 text-sky-800 font-semibold px-2.5 py-1 rounded-md transition cursor-pointer flex items-center gap-1">
                <span>📍 快速選址</span>
              </button>
            </div>
            <input id="addressInput" type="text" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 outline-none" placeholder="點擊上方「快速選址」或手動輸入地址">
          </div>
        </div>
        <div class="mt-6 flex justify-end">
          <button type="button" onclick="switchStep(2)" class="bg-sky-600 hover:bg-sky-700 text-white px-6 py-3 rounded-xl font-medium shadow-md transition cursor-pointer">下一步</button>
        </div>
      </div>

      <!-- ========================================== -->
      <!-- STEP 2: 醫療病史 (帶連動明細輸入框) -->
      <!-- ========================================== -->
      <div class="step-pane hidden" data-step="2">
        <h2 class="text-lg font-bold text-slate-800 mb-4 border-b pb-2">2. 醫療病史</h2>
        
        <div class="space-y-4 text-sm">
          <div>
            <p class="font-semibold text-slate-700 mb-2">請確認您是否有相關狀況（勾選後可填寫詳細說明）：</p>
            <div class="space-y-3 text-xs">
              
              <!-- 1. 心血管疾病 -->
              <div class="p-3 border border-slate-200 rounded-xl hover:border-sky-400 bg-slate-50/60 transition">
                <label class="flex items-start space-x-3 cursor-pointer">
                  <input type="checkbox" class="med-checkbox mt-0.5 w-4 h-4 text-sky-600 shrink-0" data-target="detail-cardio">
                  <span><strong class="text-slate-800 text-sm block mb-0.5">心血管疾病</strong>如：心臟病/瓣膜缺損/閉鎖不全、心導管/支架、心絞痛/心肌梗塞、高低血壓</span>
                </label>
                <div id="detail-cardio" class="hidden mt-2.5 pl-7">
                  <input type="text" class="w-full p-2 border border-slate-300 rounded-lg bg-white text-xs focus:ring-2 focus:ring-sky-500 outline-none" placeholder="請填寫心血管疾病詳細說明（例如：高血壓服藥控制中）">
                </div>
              </div>

              <!-- 2. 代謝性疾病 -->
              <div class="p-3 border border-slate-200 rounded-xl hover:border-sky-400 bg-slate-50/60 transition">
                <label class="flex items-start space-x-3 cursor-pointer">
                  <input type="checkbox" class="med-checkbox mt-0.5 w-4 h-4 text-sky-600 shrink-0" data-target="detail-metabolic">
                  <span><strong class="text-slate-800 text-sm block mb-0.5">代謝性疾病</strong>如：糖尿病、甲狀腺功能亢進/低下</span>
                </label>
                <div id="detail-metabolic" class="hidden mt-2.5 pl-7">
                  <input type="text" class="w-full p-2 border border-slate-300 rounded-lg bg-white text-xs focus:ring-2 focus:ring-sky-500 outline-none" placeholder="請填寫代謝性疾病詳細說明（例如：第二型糖尿病）">
                </div>
              </div>

              <!-- 3. 自體免疫疾病 -->
              <div class="p-3 border border-slate-200 rounded-xl hover:border-sky-400 bg-slate-50/60 transition">
                <label class="flex items-start space-x-3 cursor-pointer">
                  <input type="checkbox" class="med-checkbox mt-0.5 w-4 h-4 text-sky-600 shrink-0" data-target="detail-autoimmune">
                  <span><strong class="text-slate-800 text-sm block mb-0.5">自體免疫疾病</strong>如：紅斑性狼瘡、風溼性關節炎、乾燥症、器官移植等</span>
                </label>
                <div id="detail-autoimmune" class="hidden mt-2.5 pl-7">
                  <input type="text" class="w-full p-2 border border-slate-300 rounded-lg bg-white text-xs focus:ring-2 focus:ring-sky-500 outline-none" placeholder="請填寫自體免疫疾病詳細說明">
                </div>
              </div>

              <!-- 4. 血液相關疾病 -->
              <div class="p-3 border border-slate-200 rounded-xl hover:border-sky-400 bg-slate-50/60 transition">
                <label class="flex items-start space-x-3 cursor-pointer">
                  <input type="checkbox" class="med-checkbox mt-0.5 w-4 h-4 text-sky-600 shrink-0" data-target="detail-blood">
                  <span><strong class="text-slate-800 text-sm block mb-0.5">血液相關疾病</strong>如：凝血功能異常、貧血、蠶豆症等</span>
                </label>
                <div id="detail-blood" class="hidden mt-2.5 pl-7">
                  <input type="text" class="w-full p-2 border border-slate-300 rounded-lg bg-white text-xs focus:ring-2 focus:ring-sky-500 outline-none" placeholder="請填寫血液疾病詳細說明">
                </div>
              </div>

              <!-- 5. 臟器疾病 -->
              <div class="p-3 border border-slate-200 rounded-xl hover:border-sky-400 bg-slate-50/60 transition">
                <label class="flex items-start space-x-3 cursor-pointer">
                  <input type="checkbox" class="med-checkbox mt-0.5 w-4 h-4 text-sky-600 shrink-0" data-target="detail-organ">
                  <span><strong class="text-slate-800 text-sm block mb-0.5">臟器疾病</strong>如：胃/十二指腸潰瘍、腎臟疾病、透析(洗腎)</span>
                </label>
                <div id="detail-organ" class="hidden mt-2.5 pl-7">
                  <input type="text" class="w-full p-2 border border-slate-300 rounded-lg bg-white text-xs focus:ring-2 focus:ring-sky-500 outline-none" placeholder="請填寫臟器疾病詳細說明">
                </div>
              </div>

              <!-- 6. 良/惡性腫瘤(癌症) -->
              <div class="p-3 border border-slate-200 rounded-xl hover:border-sky-400 bg-slate-50/60 transition">
                <label class="flex items-start space-x-3 cursor-pointer">
                  <input type="checkbox" class="med-checkbox mt-0.5 w-4 h-4 text-sky-600 shrink-0" data-target="detail-tumor">
                  <span class="text-slate-800 text-sm font-bold">良/惡性腫瘤(癌症)</span>
                </label>
                <div id="detail-tumor" class="hidden mt-2.5 pl-7">
                  <input type="text" class="w-full p-2 border border-slate-300 rounded-lg bg-white text-xs focus:ring-2 focus:ring-sky-500 outline-none" placeholder="請註明部位或病名">
                </div>
              </div>

              <!-- 7. 傳染性疾病 -->
              <div class="p-3 border border-slate-200 rounded-xl hover:border-sky-400 bg-slate-50/60 transition">
                <label class="flex items-start space-x-3 cursor-pointer">
                  <input type="checkbox" class="med-checkbox mt-0.5 w-4 h-4 text-sky-600 shrink-0" data-target="detail-infectious">
                  <span><strong class="text-slate-800 text-sm block mb-0.5">傳染性疾病</strong>如：肺結核、ABCD型肝炎、人類乳突病毒(HPV)、人類免疫缺乏病毒(HIV)等</span>
                </label>
                <div id="detail-infectious" class="hidden mt-2.5 pl-7">
                  <input type="text" class="w-full p-2 border border-slate-300 rounded-lg bg-white text-xs focus:ring-2 focus:ring-sky-500 outline-none" placeholder="請填寫傳染性疾病詳細說明">
                </div>
              </div>

              <!-- 8. 其他頭頸部相關疾病 -->
              <div class="p-3 border border-slate-200 rounded-xl hover:border-sky-400 bg-slate-50/60 transition">
                <label class="flex items-start space-x-3 cursor-pointer">
                  <input type="checkbox" class="med-checkbox mt-0.5 w-4 h-4 text-sky-600 shrink-0" data-target="detail-headneck">
                  <span><strong class="text-slate-800 text-sm block mb-0.5">其他頭頸部相關疾病</strong>如：鼻竇炎、口腔黏膜異常、口乾症、張口受限、顳顎關節疾病等</span>
                </label>
                <div id="detail-headneck" class="hidden mt-2.5 pl-7">
                  <input type="text" class="w-full p-2 border border-slate-300 rounded-lg bg-white text-xs focus:ring-2 focus:ring-sky-500 outline-none" placeholder="請填寫頭頸部疾病詳細說明">
                </div>
              </div>

            </div>
          </div>

          <div class="pt-2 border-t border-slate-100">
            <p class="font-semibold text-slate-700 mb-2">日常健康習慣：</p>
            <div class="grid grid-cols-3 gap-2 text-xs">
              <label class="p-2.5 border border-slate-200 rounded-lg flex items-center justify-center space-x-2 bg-slate-50 hover:bg-sky-50 cursor-pointer">
                <input type="checkbox" class="w-4 h-4 text-sky-600">
                <span>抽菸</span>
              </label>
              <label class="p-2.5 border border-slate-200 rounded-lg flex items-center justify-center space-x-2 bg-slate-50 hover:bg-sky-50 cursor-pointer">
                <input type="checkbox" class="w-4 h-4 text-sky-600">
                <span>酗酒</span>
              </label>
              <label class="p-2.5 border border-slate-200 rounded-lg flex items-center justify-center space-x-2 bg-slate-50 hover:bg-sky-50 cursor-pointer">
                <input type="checkbox" class="w-4 h-4 text-sky-600">
                <span>嚼食檳榔</span>
              </label>
            </div>
          </div>

          <div class="pt-2 border-t border-slate-100 space-y-3">
            <div>
              <label class="block font-semibold text-slate-700 mb-1 text-xs">手術 / 住院病史（若有請填寫原因）：</label>
              <input type="text" class="w-full p-2.5 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-sky-500 outline-none" placeholder="請填寫原因（無則免填）">
            </div>

            <div class="p-3 bg-pink-50/70 border border-pink-200 rounded-xl flex flex-col sm:flex-row sm:items-center justify-between gap-2">
              <label class="flex items-center space-x-2 text-xs font-semibold text-pink-900 cursor-pointer">
                <input type="checkbox" class="w-4 h-4 text-pink-600">
                <span>懷孕中（請女性填答）</span>
              </label>
              <div class="flex items-center space-x-2 text-xs text-pink-900">
                <span>週數：</span>
                <input type="number" min="1" max="42" class="w-20 p-1.5 border border-pink-300 rounded-lg bg-white text-center focus:ring-2 focus:ring-pink-400 outline-none" placeholder="週">
                <span>週</span>
              </div>
            </div>
          </div>
        </div>

        <div class="mt-6 flex justify-between">
          <button type="button" onclick="switchStep(1)" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-6 py-3 rounded-xl font-medium transition cursor-pointer">上一步</button>
          <button type="button" onclick="switchStep(3)" class="bg-sky-600 hover:bg-sky-700 text-white px-6 py-3 rounded-xl font-medium shadow-md transition cursor-pointer">下一步</button>
        </div>
      </div>

      <!-- ========================================== -->
      <!-- STEP 3: 醫療及用藥安全 -->
      <!-- ========================================== -->
      <div class="step-pane hidden" data-step="3">
        <h2 class="text-lg font-bold text-slate-800 mb-4 border-b pb-2">3. 醫療及用藥安全</h2>
        
        <div class="bg-amber-50 border border-amber-200 p-4 rounded-xl mb-5 text-xs text-amber-900 space-y-2.5">
          <p class="font-bold">⚠️ 醫療安全關鍵確認（若有請勾選）</p>
          <label class="flex items-start space-x-2.5 cursor-pointer">
            <input type="checkbox" class="mt-0.5 w-4 h-4 text-sky-600 shrink-0">
            <span>目前是否服用抗凝血劑或有凝血功能異常？</span>
          </label>
          <label class="flex items-start space-x-2.5 cursor-pointer">
            <input type="checkbox" class="mt-0.5 w-4 h-4 text-sky-600 shrink-0">
            <span>是否使用抗骨質疏鬆藥物（口服或針劑）？</span>
          </label>
          <label class="flex items-start space-x-2.5 cursor-pointer">
            <input type="checkbox" class="mt-0.5 w-4 h-4 text-sky-600 shrink-0">
            <span>頭頸部曾因腫瘤接受過手術或放射性治療？</span>
          </label>
          <label class="flex items-start space-x-2.5 cursor-pointer">
            <input type="checkbox" class="mt-0.5 w-4 h-4 text-sky-600 shrink-0">
            <span>患有慢性病病患，最近一次血糖、血壓、血脂數據，仍有數據為超過正常範圍</span>
          </label>
        </div>

        <div class="space-y-3 text-sm">
          <label class="block font-medium text-slate-700">藥物過敏史（可複選）：</label>
          <div class="grid grid-cols-2 gap-2 text-xs">
            <label class="p-2.5 border border-slate-200 rounded-lg flex items-center space-x-2 bg-slate-50 hover:border-sky-400 cursor-pointer">
              <input type="checkbox" class="w-4 h-4 text-sky-600">
              <span>無特殊過敏</span>
            </label>
            <label class="p-2.5 border border-slate-200 rounded-lg flex items-center space-x-2 bg-slate-50 hover:border-sky-400 cursor-pointer">
              <input type="checkbox" class="w-4 h-4 text-sky-600">
              <span>盤尼西林 (Penicillin)</span>
            </label>
            <label class="p-2.5 border border-slate-200 rounded-lg flex items-center space-x-2 bg-slate-50 hover:border-sky-400 cursor-pointer">
              <input type="checkbox" class="w-4 h-4 text-sky-600">
              <span>阿斯匹靈 (Aspirin)</span>
            </label>
            <label class="p-2.5 border border-slate-200 rounded-lg flex items-center space-x-2 bg-slate-50 hover:border-sky-400 cursor-pointer">
              <input type="checkbox" class="w-4 h-4 text-sky-600">
              <span>磺胺類藥物</span>
            </label>
            <label class="p-2.5 border border-slate-200 rounded-lg flex items-center space-x-2 bg-slate-50 hover:border-sky-400 cursor-pointer">
              <input type="checkbox" class="w-4 h-4 text-sky-600">
              <span>止痛藥(NSAID)</span>
            </label>
            <label class="p-2.5 border border-slate-200 rounded-lg flex items-center space-x-2 bg-slate-50 hover:border-sky-400 cursor-pointer">
              <input type="checkbox" class="w-4 h-4 text-sky-600">
              <span>比林類(Pyrines)</span>
            </label>
          </div>

          <div class="p-3 border border-slate-200 rounded-lg bg-slate-50/70">
            <label class="flex items-center space-x-2 text-xs font-medium text-slate-700 cursor-pointer mb-2">
              <input type="checkbox" class="w-4 h-4 text-sky-600">
              <span>其他（請填寫）：</span>
            </label>
            <input type="text" class="w-full p-2 border border-slate-300 rounded-lg bg-white text-xs focus:ring-2 focus:ring-sky-500 outline-none" placeholder="請填寫其他過敏藥物或食物名稱">
          </div>
        </div>

        <div class="mt-6 flex justify-between">
          <button type="button" onclick="switchStep(2)" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-6 py-3 rounded-xl font-medium transition cursor-pointer">上一步</button>
          <button type="button" onclick="switchStep(4)" class="bg-sky-600 hover:bg-sky-700 text-white px-6 py-3 rounded-xl font-medium shadow-md transition cursor-pointer">下一步</button>
        </div>
      </div>

      <!-- ========================================== -->
      <!-- STEP 4: 就診心理狀態與電子簽名 -->
      <!-- ========================================== -->
      <div class="step-pane hidden" data-step="4">
        <h2 class="text-lg font-bold text-slate-800 mb-4 border-b pb-2">4. 就診心理狀態</h2>
        
        <div class="space-y-5 text-sm">
          <div>
            <label class="block font-medium text-slate-700 mb-2">心理狀態與需求（可複選）：</label>
            <div class="flex flex-wrap gap-2 text-xs">
              <label class="border px-3 py-2 rounded-full cursor-pointer hover:bg-sky-50"><input type="checkbox" class="mr-1"> 非常怕痛</label>
              <label class="border px-3 py-2 rounded-full cursor-pointer hover:bg-sky-50"><input type="checkbox" class="mr-1"> 容易緊張</label>
              <label class="border px-3 py-2 rounded-full cursor-pointer hover:bg-sky-50"><input type="checkbox" class="mr-1"> 易嘔吐</label>
            </div>
          </div>

          <div>
            <label class="block font-medium text-slate-700 mb-2">過去就診不愉快經驗（可複選）：</label>
            <div class="grid grid-cols-2 gap-2 text-xs">
              <label class="p-2.5 border border-slate-200 rounded-lg flex items-center space-x-2 bg-slate-50 hover:border-sky-400 cursor-pointer">
                <input type="checkbox" class="w-4 h-4 text-sky-600">
                <span>等候太久</span>
              </label>
              <label class="p-2.5 border border-slate-200 rounded-lg flex items-center space-x-2 bg-slate-50 hover:border-sky-400 cursor-pointer">
                <input type="checkbox" class="w-4 h-4 text-sky-600">
                <span>治療過程疼痛</span>
              </label>
              <label class="p-2.5 border border-slate-200 rounded-lg flex items-center space-x-2 bg-slate-50 hover:border-sky-400 cursor-pointer">
                <input type="checkbox" class="w-4 h-4 text-sky-600">
                <span>感覺不衛生</span>
              </label>
              <label class="p-2.5 border border-slate-200 rounded-lg flex items-center space-x-2 bg-slate-50 hover:border-sky-400 cursor-pointer">
                <input type="checkbox" class="w-4 h-4 text-sky-600">
                <span>工作人員態度差</span>
              </label>
              <label class="p-2.5 border border-slate-200 rounded-lg flex items-center space-x-2 bg-slate-50 hover:border-sky-400 cursor-pointer">
                <input type="checkbox" class="w-4 h-4 text-sky-600">
                <span>專業性不足</span>
              </label>
            </div>

            <div class="mt-2 p-3 border border-slate-200 rounded-lg bg-slate-50/70">
              <label class="flex items-center space-x-2 text-xs font-medium text-slate-700 cursor-pointer mb-2">
                <input type="checkbox" class="w-4 h-4 text-sky-600">
                <span>其他：</span>
              </label>
              <input type="text" class="w-full p-2 border border-slate-300 rounded-lg bg-white text-xs focus:ring-2 focus:ring-sky-500 outline-none" placeholder="請填寫其他不愉快經驗">
            </div>
          </div>

          <!-- 同意事項區 -->
          <div class="space-y-3 pt-3 border-t border-slate-200">
            <!-- 非必填：X光檢查同意 -->
            <label class="flex items-start space-x-2.5 text-xs font-medium text-slate-700 cursor-pointer">
              <input type="checkbox" class="mt-0.5 w-4 h-4 text-sky-600 shrink-0">
              <span>本人同意接受全口數位 X 光攝影檢查（健保給付）</span>
            </label>

            <!-- 必填：個人資料處理運用聲明 -->
            <div class="p-3 bg-sky-50/70 border border-sky-200 rounded-xl">
              <label class="flex items-start space-x-2.5 text-xs text-slate-800 cursor-pointer">
                <input type="checkbox" required class="mt-0.5 w-4 h-4 text-sky-600 shrink-0">
                <span class="leading-relaxed">
                  <strong class="text-sky-900">個人資料處理運用聲明 <span class="text-red-500">*</span></strong><br>
                  本人已詳閱並同意博識牙醫診所依據個人資料保護法之規定，於醫療服務、病歷管理、健保申報及相關就診聯繫之特定目的範圍內，蒐集、處理及利用本人所填寫之個人資料與健康資訊。
                </span>
              </label>
            </div>
          </div>

          <!-- 簽名畫布區 -->
          <div>
            <label class="block font-medium text-slate-700 mb-1 text-xs">病患數位簽名 <span class="text-red-500">*</span></label>
            <div class="border-2 border-dashed border-slate-300 rounded-xl bg-slate-50 p-2 relative">
              <canvas id="signature-pad" class="w-full h-36 bg-white rounded-lg cursor-crosshair block"></canvas>
              <button type="button" id="clearBtn" class="absolute bottom-3 right-4 text-xs text-rose-600 bg-white px-3 py-1.5 border rounded-md shadow-sm hover:bg-rose-50 cursor-pointer">清除重簽</button>
            </div>
          </div>
        </div>

        <div class="mt-6 flex justify-between">
          <button type="button" onclick="switchStep(3)" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-6 py-3 rounded-xl font-medium transition cursor-pointer">上一步</button>
          <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3 rounded-xl font-bold shadow-md transition cursor-pointer">確認送出初診單</button>
        </div>
      </div>

    </form>
  </div>

  <!-- ========================================== -->
  <!-- 快速選址 Modal (嵌入 AddressPage.html) -->
  <!-- ========================================== -->
  <div id="addressModal" class="fixed inset-0 z-50 hidden bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-3 sm:p-6">
    <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
      <!-- Modal Header -->
      <div class="bg-sky-700 text-white px-4 py-3 flex items-center justify-between">
        <span class="font-bold text-sm">📍 快速地址輸入器</span>
        <button type="button" onclick="closeAddressModal()" class="text-sky-100 hover:text-white text-lg font-bold px-2 cursor-pointer">&times;</button>
      </div>
      
      <!-- Embedded AddressPage.html -->
      <div class="flex-1 overflow-y-auto bg-slate-50">
        <iframe 
          id="addressFrame" 
          src="https://ychuang-tw.github.io/AddressInputer/AddressPage.html" 
          class="w-full h-[460px] border-0 block"
          title="快速地址選擇器">
        </iframe>
      </div>

      <!-- Modal Footer: 確認與關閉視窗按鈕並排對齊且樣式一致 -->
      <div class="bg-slate-100 px-4 py-2.5 border-t flex justify-end items-center gap-2">
        <button type="button" onclick="closeAddressModal()" class="bg-slate-300 hover:bg-slate-400 text-slate-700 px-4 py-1.5 rounded-lg text-xs font-medium transition cursor-pointer">關閉視窗</button>
        <button type="button" onclick="confirmAddressSelection()" class="bg-sky-600 hover:bg-sky-700 text-white px-4 py-1.5 rounded-lg text-xs font-medium shadow-xs transition cursor-pointer">確認</button>
      </div>
    </div>
  </div>

  <script>
    let signaturePad = null;

    window.switchStep = function(targetStep) {
      document.querySelectorAll('.step-pane').forEach(el => el.classList.add('hidden'));
      const targetPane = document.querySelector(`[data-step="${targetStep}"]`);
      if (targetPane) {
        targetPane.classList.remove('hidden');
      }

      document.querySelectorAll('.step-ind').forEach((el, index) => {
        if (index + 1 === targetStep) {
          el.classList.add('text-white', 'border-b-2', 'border-white', 'opacity-100');
          el.classList.remove('opacity-60');
        } else {
          el.classList.remove('text-white', 'border-b-2', 'border-white');
          el.classList.add('opacity-60');
        }
      });
      window.scrollTo({ top: 0, behavior: 'smooth' });

      if (targetStep === 4 && signaturePad) {
        setTimeout(resizeCanvas, 50);
      }
    }

    // 開啟 / 關閉快速選址視窗
    window.openAddressModal = function() {
      document.getElementById('addressModal').classList.remove('hidden');
    }

    window.closeAddressModal = function() {
      document.getElementById('addressModal').classList.add('hidden');
    }

    // 點擊外部「確認」按鈕：直接從同網域 iframe 的 #Address 取得地址並填入主表單
    window.confirmAddressSelection = function() {
      try {
        const frame = document.getElementById('addressFrame');
        const doc = frame.contentDocument || frame.contentWindow.document;
        const addrEl = doc.getElementById('Address') || doc.querySelector('input[type="text"], textarea');
        const selectedAddr = addrEl ? addrEl.value.trim() : '';

        if (!selectedAddr) {
          alert('請先在上方選單中完成地址選取！');
          return;
        }

        const addressInput = document.getElementById('addressInput');
        if (addressInput) {
          addressInput.value = selectedAddr;
          addressInput.dispatchEvent(new Event('input', { bubbles: true }));
        }
        closeAddressModal();
      } catch (err) {
        console.warn('讀取地址時發生錯誤：', err);
      }
    }

    // 保留 postMessage 監聽器以相容 iframe 主動傳送訊息
    window.addEventListener('message', (event) => {
      if (event.origin !== 'https://ychuang-tw.github.io') return;

      const data = event.data;
      const selectedAddr = typeof data === 'string' 
        ? data 
        : (data?.address || data?.fullAddress);

      if (selectedAddr) {
        const addressInput = document.getElementById('addressInput');
        if (addressInput) {
          addressInput.value = selectedAddr.trim();
          addressInput.dispatchEvent(new Event('input', { bubbles: true }));
        }
        closeAddressModal();
      }
    });

    function initSignaturePad() {
      const canvas = document.getElementById('signature-pad');
      if (!canvas) return;

      signaturePad = new SignaturePad(canvas, { 
        penColor: 'rgb(3, 105, 161)',
        minWidth: 1,
        maxWidth: 3
      });

      resizeCanvas();
    }

    function resizeCanvas() {
      const canvas = document.getElementById('signature-pad');
      if (!canvas || !signaturePad) return;

      const ratio = Math.max(window.devicePixelRatio || 1, 1);
      canvas.width = canvas.offsetWidth * ratio;
      canvas.height = canvas.offsetHeight * ratio;
      canvas.getContext("2d").scale(ratio, ratio);
    }

    window.addEventListener('DOMContentLoaded', () => {
      initSignaturePad();

      // 第 2 頁醫療病史勾選連動顯示輸入框邏輯
      document.querySelectorAll('.med-checkbox').forEach(checkbox => {
        checkbox.addEventListener('change', (e) => {
          const targetId = e.target.getAttribute('data-target');
          const detailBox = document.getElementById(targetId);
          if (detailBox) {
            if (e.target.checked) {
              detailBox.classList.remove('hidden');
              const input = detailBox.querySelector('input');
              if (input) input.focus();
            } else {
              detailBox.classList.add('hidden');
              const input = detailBox.querySelector('input');
              if (input) input.value = '';
            }
          }
        });
      });

      const clearBtn = document.getElementById('clearBtn');
      if (clearBtn) {
        clearBtn.addEventListener('click', () => {
          if (signaturePad) signaturePad.clear();
        });
      }

      const form = document.getElementById('intakeForm');
      if (form) {
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          if (!signaturePad || signaturePad.isEmpty()) {
            alert('請先完成病患簽名後再送出！');
            return;
          }
          const dataUrl = signaturePad.toDataURL('image/png');
          console.log('簽名圖片資料 (Base64):', dataUrl);
          alert('初診表單已成功送出！');
        });
      }
    });

    window.addEventListener('resize', resizeCanvas);
  </script>
</body>
</html>
