<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="utf-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://ychuang-tw.github.io/AddressInputer/awd-mobile.css" type="text/css">
    <link rel="stylesheet" href="https://ychuang-tw.github.io/AddressInputer/eshop-ui-mobile.css" type="text/css">
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
</head>
<body style="width:90%;margin:10px;">
    <section>
        <article>
            <div class="form-group">
                <div class="form-textual">
                    <label>現居地址</label>
                </div>
                <div><label id="labelMessage" style="color:red;font-size:14px;visibility:hidden">已預先輸入地址，可直接按下一頁繼續。</label></div>
                <div class="nekos">
                    <div class="neko is-4">
                        <div class="form-textual horizontal">
                            <select class="is-12" id="Cities" name="Cities" onChange="GetDistricts();ConcatAddress();">
                                <option value="">縣市</option>
                                <option value="台北市">台北市</option>
                                <option value="新北市">新北市</option>
                                <option value="基隆市">基隆市</option>
                                <option value="宜蘭縣">宜蘭縣</option>
                                <option value="桃園市">桃園市</option>
                                <option value="新竹市">新竹市</option>
                                <option value="新竹縣">新竹縣</option>
                                <option value="苗栗縣">苗栗縣</option>
                                <option value="台中市">台中市</option>
                                <option value="彰化縣">彰化縣</option>
                                <option value="南投縣">南投縣</option>
                                <option value="雲林縣">雲林縣</option>
                                <option value="嘉義市">嘉義市</option>
                                <option value="嘉義縣">嘉義縣</option>
                                <option value="台南市">台南市</option>
                                <option value="高雄市">高雄市</option>
                                <option value="屏東縣">屏東縣</option>
                                <option value="台東縣">台東縣</option>
                                <option value="花蓮縣">花蓮縣</option>
                                <option value="澎湖縣">澎湖縣</option>
                                <option value="金門縣">金門縣</option>
                                <option value="連江縣">連江縣</option>
                                <option value="南海島">南海島</option>
                            </select>
                        </div>
                    </div>
                    <div class="neko is-8">
                        <div class="form-textual horizontal">
                            <select class="is-12" id="Areas" name="Areas" onChange="GetIndexes();ConcatAddress();">
                                <option value="">(鄉 \ 鎮 \ 區)</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <div class="nekos">
                    <div class="neko is-4">
                        <div class="form-textual horizontal">
                            <select class="is-12" id="Phonetics" name="Phonetics" onChange="GetRoads()">
                                <option value="">(注音篩選)</option>
                                <option value="ㄅ">ㄅ</option>
                                <option value="ㄆ">ㄆ</option>
                                <option value="ㄇ">ㄇ</option>
                                <option value="ㄈ">ㄈ</option>
                                <option value="ㄉ">ㄉ</option>
                                <option value="ㄊ">ㄊ</option>
                                <option value="ㄋ">ㄋ</option>
                                <option value="ㄌ">ㄌ</option>
                                <option value="ㄍ">ㄍ</option>
                                <option value="ㄎ">ㄎ</option>
                                <option value="ㄏ">ㄏ</option>
                                <option value="ㄐ">ㄐ</option>
                                <option value="ㄑ">ㄑ</option>
                                <option value="ㄒ">ㄒ</option>
                                <option value="ㄓ">ㄓ</option>
                                <option value="ㄔ">ㄔ</option>
                                <option value="ㄕ">ㄕ</option>
                                <option value="ㄖ">ㄖ</option>
                                <option value="ㄗ">ㄗ</option>
                                <option value="ㄘ">ㄘ</option>
                                <option value="ㄙ">ㄙ</option>
                                <option value="ㄚ">ㄚ</option>
                                <option value="ㄛ">ㄛ</option>
                                <option value="ㄜ">ㄜ</option>
                                <option value="ㄝ">ㄝ</option>
                                <option value="ㄞ">ㄞ</option>
                                <option value="ㄟ">ㄟ</option>
                                <option value="ㄠ">ㄠ</option>
                                <option value="ㄡ">ㄡ</option>
                                <option value="ㄢ">ㄢ</option>
                                <option value="ㄣ">ㄣ</option>
                                <option value="ㄤ">ㄤ</option>
                                <option value="ㄥ">ㄥ</option>
                                <option value="ㄦ">ㄦ</option>
                                <option value="ㄧ">ㄧ</option>
                                <option value="ㄨ">ㄨ</option>
                                <option value="ㄩ">ㄩ</option>
                            </select>
                        </div>
                    </div>
                    <div class="neko is-8">
                        <div class="form-textual horizontal">
                            <select class="is-12" id="RoadStreets" name="RoadStreets" onChange="ConcatAddress();">
                                <option value="">(路 \ 街 \ 道 \ 村 \ 里)</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <div class="nekos is-stubborn">
                    <div class="neko is-3">
                        <div class="form-textual horizontal">
                            <select class="is-8" id="RoadSections" name="RoadSections" onchange="ConcatAddress();">
                                <option value=""></option>
                                <option value="1">一</option>
                                <option value="2">二</option>
                                <option value="3">三</option>
                                <option value="4">四</option>
                                <option value="5">五</option>
                                <option value="6">六</option>
                                <option value="7">七</option>
                                <option value="8">八</option>
                                <option value="9">九</option>
                            </select> 段
                        </div>
                    </div>
                    <div class="neko is-3">
                        <div class="form-textual horizontal">
                            <input type="tel" id="LLLLL" class="onlyNumber is-7" maxlength="5" onkeyup="removeExceptNumber(this)" onchange="ConcatAddress()"><span> 巷</span>
                        </div>
                    </div>
                    <div class="neko is-3">
                        <div class="form-textual horizontal">
                            <input type="tel" id="AAAAA" class="onlyNumber is-6" maxlength="5" onkeyup="removeExceptNumber(this)" onchange="ConcatAddress()"><span>弄</span>
                        </div>
                    </div>
                </div>
                <div class="nekos is-stubborn">
                    <div class="neko is-3">
                        <div class="form-textual horizontal">
                            <input type="tel" id="NNNN" class="onlyNumber is-6" maxlength="5" onkeyup="removeExceptNumber(this)" onchange="ConcatAddress()"> 號之
                        </div>
                    </div>
                    <div class="neko is-3">
                        <div class="form-textual horizontal">
                            <input type="tel" id="EEE" class="onlyNumber is-6" maxlength="5" onkeyup="removeExceptNumber(this)" onchange="ConcatAddress()"><span> ，</span>
                        </div>
                    </div>
                    <div class="neko is-3">
                        <div class="form-textual horizontal">
                            <input type="text" id="GGG" class="is-6" maxlength="5" onblur="ChangeCase(this)" onkeyup="removeExceptNumber_Letter(this)" onchange="ConcatAddress()"> <span> 棟，</span>
                        </div>
                    </div>
                </div>
                <div class="nekos is-stubborn">
                    <div class="neko is-3">
                        <div class="form-textual horizontal">
                            <input type="tel" id="FFF" class="is-6" maxlength="5" onblur="ChangeCase(this)" onkeyup="removeExceptNumber_Letter(this)" onchange="ConcatAddress()"> 樓之
                        </div>
                    </div>
                    <div class="neko is-3">
                        <div class="form-textual horizontal">
                            <input type="text" id="DDD" class="onlyNumber is-6" maxlength="5" onkeyup="removeExceptNumber(this)" onchange="ConcatAddress()"><span> ，</span>
                        </div>
                    </div>
                    <div class="neko is-3">
                        <div class="form-textual horizontal">
                            <input type="text" id="RRRR" class="is-6" maxlength="5" onblur="ChangeCase(this)" onkeyup="removeExceptNumber_Letter(this)" onchange="ConcatAddress()"><span> 室之</span>
                        </div>
                    </div>
                    <div class="neko is-3">
                        <div class="form-textual horizontal">
                            <input type="text" id="MMMM" class="onlyNumber is-6" maxlength="5" onkeyup="removeExceptNumber(this)" onchange="ConcatAddress()"><span>&nbsp;</span>
                        </div>
                    </div>
                </div>
                <div class="form-textual">
                    <p class="description">註:若地址為8-2號，則請輸入8號之2。 樓層可輸入英文，如 B1。</p>
                </div>
            </div>
        </article>
        <!-- 地址顯示與確認按鈕的容器 (同一列) -->
        <div class="flex items-center gap-2 w-full mt-4">
          <!-- 地址結果輸入框 -->
          <input 
            type="text" 
            id="Address" 
            class="flex-1 p-3 border border-slate-300 rounded-xl bg-slate-50 text-sm focus:ring-2 focus:ring-sky-500 outline-none" 
            placeholder="請在上方選擇縣市、鄉鎮與路段" 
            readonly />
          
          <!-- 美化後的確認按鈕 (與 Address 欄位同高、同列) -->
          <button 
            type="button" 
            id="confirmAddressBtn"
            class="class="bg-slate-300 hover:bg-slate-400 text-slate-700 px-4 py-1.5 rounded-lg text-xs font-medium cursor-pointer"">
            確認
          </button>
        </div>
    </section>

    <script type="text/javascript">
        var domAreas;
        var domIndexes;
        var domRoads;
        var baseUrl = "https://ychuang-tw.github.io/AddressInputer/";
        var predefinedAddress = false;
        function setFieldNumeric(e) {
            $(e).prop("type", "number"); $(e).prop("inputmode", "numeric");
            $(e).prop("pattern", "[0-9]*");
        }                           
        function ConcatAddress() {
            var city = $("#Cities").val();
            var district = $("#Areas").val();
            var road = $("#RoadStreets").val();
            var secNum = $("#RoadSections").val();
            var laneNum = $("#LLLLL").val();
            var alleyNum = $("#AAAAA").val();
            var plateNum = $("#NNNN").val();
            var plateNumExt = $("#EEE").val();
            var buildingNum = $("#GGG").val();
            var floorNum = $("#FFF").val();
            var floorNumExt = $("#DDD").val();
            var roomNum = $("#RRRR").val();
            var rootNumExt = $("#MMMM").val();

            secNum = (secNum === "" ? "" : secNum + "段");
            laneNum = (laneNum === "" ? "" : laneNum + "巷");
            alleyNum = (alleyNum === "" ? "" : alleyNum + "弄");
            plateNum = (plateNum === "" ? "" : plateNum + "號");
            plateNumExt = (plateNumExt === "" ? "" : "之" + plateNumExt + ",");
            buildingNum = (buildingNum === "" ? "" : buildingNum + "棟");
            floorNum = (floorNum === "" ? "" : floorNum + "樓");
            floorNumExt = (floorNumExt === "" ? "" : "之" + floorNumExt);
            roomNum = (roomNum === "" ? "" : "," + roomNum + "室");
            rootNumExt = (rootNumExt === "" ? "" : "之" + rootNumExt);

            var fullAddress = city + district + road + secNum + laneNum + alleyNum + plateNum + plateNumExt + buildingNum + floorNum + floorNumExt + roomNum + rootNumExt;
            $("input#address").val(fullAddress);
        }
        function domAreaPreset() {
            domAreas.empty();
            /*
            domAreas.append($('<option>', {
                        text : "(鄉 \ 鎮 \ 區)"
                    }));
            */
        }
        function domIndexPreset() {
            domIndexes.empty();
            domIndexes.append($('<option>', { value: "", text: "(注音篩選)" }));
        }
        function storageAvailable(type) {
            let storage;
            try {
                storage = window[type];
                const x = "__storage_test__";
                storage.setItem(x, x);
                storage.removeItem(x);
                return true;
            } catch (e) {
                return (
                    e instanceof DOMException &&
                    e.name === "QuotaExceededError" &&
                    // acknowledge QuotaExceededError only if there's something already stored
                    storage &&
                    storage.length !== 0
                );
            }
        }
        function domRoadPreset() {
            domRoads.empty();
            domRoads.append($('<option>', { value: "", text: "(路 \\ 街 \\ 道 \\ 村 \\ 里)" }));
        }
        function GetDistricts() {
            var city = $("#Cities").val();
            console.log(city);
            if (storageAvailable("localStorage")) {
                var y = localStorage.getItem(city);
                if (y == null || y == undefined) {
                    $.getJSON(baseUrl + city + ".json", function (x) { localStorage.setItem(city, JSON.stringify(x)); console.log(x); ParseCityData(x); });
                }
                else {
                    ParseCityData(JSON.parse(y));
                }
            }
        //    $.getJSON(baseUrl + city + ".json", function (y) {
        //        cityJSON = y;
        //        var districts = Object.keys(cityJSON[city]);

        //        domAreaPreset();
        //        domIndexPreset();
        //        domRoadPreset();
        //        districts.forEach(function (x) {
        //            domAreas.append($('<option>', {
        //                value: x,
        //                text: x
        //            }));
        //        });
        //        GetRoads();
        //    });
        }

        function ParseCityData(y) {
            cityJSON = y;
            var city = $("#Cities").val();
            var districts = Object.keys(cityJSON[city]);
            domAreaPreset();
            domIndexPreset();
            domRoadPreset();
            districts.forEach(function (x) {
                domAreas.append($('<option>', { value: x, text: x }));
            });
            GetIndexes(); // Also calls GetRoads() -> ConcatAddress()
        }
        function GetIndexes() {
            var city = $("#Cities").val();
            var district = $("#Areas").val();
            console.log(district);
            var indexes = Object.keys(cityJSON[city][district]);
            console.log(indexes);

            domIndexPreset();
            domRoadPreset();
            indexes.forEach(function (x) {
                if (cityJSON[city][district][x].length > 0)
                    domIndexes.append($('<option>', {
                        value: x,
                        text: x
                    }));
            });
            GetRoads();
        }
        function GetRoads() {
            var city = $("#Cities").val();
            var district = $("#Areas").val();
            var index = $("#Phonetics").val();
            var roadsArray = [];
        
            if (!index || index === "(注音篩選)") {
                var keys = Object.keys(cityJSON[city][district]);
                for (var i = 0; i < keys.length; i++) {
                    cityJSON[city][district][keys[i]].forEach(x => roadsArray.push(x));
                }
            } else {
                roadsArray = cityJSON[city][district][index];
            }
        
            domRoads.empty();
            roadsArray.forEach(function (x) {
                domRoads.append($('<option>', { value: x, text: x }));
            });
        
            ConcatAddress(); // Ensure #address updates whenever roads are rebuilt
        }
        $(function () {
            $("input#address").css("width", "80%");
            var params = new URLSearchParams(location.search);
            if (location.search == '' || params.get("address")==''|| params.get("address")==null||params.get("address")==undefined ) {
                var cityJSON;
                domAreas = $("#Areas");
                domIndexes = $("#Phonetics");
                domRoads = $("#RoadStreets");
                /*$.getJSON("./屏花東澎金連.json",function(y){
                    var data=y;
                    var cities=Object.keys(data);
                    cities.forEach(function(x){
                        console.log(x)
                        var districts=Object.keys(y[x]);
                        districts.forEach(function(z){
                            console.log("    "+z);
                            var index=Object.keys(y[x][z])
                            index.forEach(function(zz){
                                console.log("       "+zz);
                                var roads=y[x][z][zz];
                                roads.forEach(function(zzz){
                                    console.log("          "+zzz.Name);
                                });
    
                            });
                        });
                    });
    
                });
                */
            }
            else {
                predefinedAddress = true;
            }

            setFieldNumeric("#LLLLL");
            setFieldNumeric("#AAAAA");
            setFieldNumeric("#NNNN");
            setFieldNumeric("#EEE");
            setFieldNumeric("#GGG");
            setFieldNumeric("#FFF");
            setFieldNumeric("#RRRR");
            setFieldNumeric("#MMMM");
        });
        function removeExceptNumber(obj) {
            obj.value = obj.value.replace(/\D/g, '');
        }

        function removeExceptNumber_Letter(obj) {
            obj.value = obj.value.replace(/[^a-z0-9]/gi, '');
        }

        function ChangeCase(elem) {
            elem.value = elem.value.toUpperCase();
        }
        function PostAddress(){
            document.getElementById('confirmAddressBtn').addEventListener('click', () => {
            const addressField = document.getElementById('Address');
            const finalAddress = addressField ? addressField.value.trim() : '';
            
            if (!finalAddress) {
            alert('請先完整選擇您的地址！');
            return;
            }
            
            // 透過 postMessage 傳回母網頁 (index.html)
            if (window.parent && window.parent !== window) {
            window.parent.postMessage(
              {
                type: 'ADDRESS_SELECTED',
                address: finalAddress
              },
              'https://ychuang-tw.github.io'
            );
            } else {
            // 獨立開啟時的備援提示
            alert('已確認地址：' + finalAddress);
            }
        });
    }
    </script>
</body>
</html>
